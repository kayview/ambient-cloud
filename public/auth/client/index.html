<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#070A14;color:#fff;font-family:sans-serif;display:grid;place-items:center;min-height:100vh}.card{width:92%;max-width:380px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:20px;text-align:center}.bubble{position:fixed;bottom:20px;right:20px;background:#0B1220;border:1px solid #3B82F6;border-radius:50px;padding:10px 16px;font-size:12px}input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.1);margin-top:8px}input{background:rgba(255,255,255,.07);color:#fff}button{background:#3B82F6;color:#fff;font-weight:700;border:none;cursor:pointer}.online{color:#00FF88}.sig{background:#0B1220;padding:12px;border-radius:10px;margin-top:12px;text-align:left}</style></head><body>
<div class="card"><h2>AMBIENT <span style="color:#3B82F6">HOST</span></h2><input id="key" placeholder="PHE-POO-HOO-EOO"><button onclick="check()">Connect</button><div id="status" style="margin-top:12px"></div><div id="scanBox" style="display:none"><select id="sym" style="width:100%;padding:12px;border-radius:10px;background:#0B1220;color:#fff;margin-top:12px"><option>EURUSD</option><option>GBPUSD</option><option>XAUUSD</option><option>BTCUSD</option></select><button onclick="scan()">Scan - Sniper AI</button><div id="sig"></div></div></div>
<div class="bubble" id="bubble">● Server Offline</div>
<script>let phe='';async function check(){phe=key.value.toUpperCase().trim();let r=await fetch('/api/status/'+phe);let d=await r.json();if(!d.online){status.innerHTML='<span style=color:#FF4444>Invalid key</span>';return}status.innerHTML='<span class=online>Server Online - MT: '+(d.mt_account||'Not bound')+'</span>';bubble.innerHTML='● Server Online - '+phe;bubble.style.color='#00FF88';scanBox.style.display='block'}async function scan(){sig.innerHTML='Scanning 43 setups...';let r=await fetch('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phe_key:phe,symbol:sym.value})});let d=await r.json();sig.innerHTML=`<div class=sig><b>${d.signal.symbol} ${d.signal.type}</b><br>Entry: ${d.signal.entry}<br>SL: ${d.signal.sl} TP: ${d.signal.tp}<br>Strategy: ${d.signal.strategy} ${d.signal.confidence}<br><button onclick="exec(${d.signal.id})">Execute on MT5</button></div>`}async function exec(id){await fetch('/api/execute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phe_key:phe,signal_id:id})});alert('Command sent to MT5 EA - Check MT5')}</script></body></html>
